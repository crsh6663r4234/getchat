# LiveKit server config for the GhostChat voice VDS.
# Replace every REPLACE_ value. Do NOT commit real keys.
port: 7880
bind_addresses:
  - ""
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 60000
  use_external_ip: true
keys:
  REPLACE_API_KEY: REPLACE_API_SECRET
turn:
  enabled: true
  domain: REPLACE_VOICE_DOMAIN
  tls_port: 5349
  udp_port: 3478
  external_tls: true
logging:
  level: info

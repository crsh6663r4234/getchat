[package]
name = "ghostchat-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
ghostchat-server = { path = "../server" }
tauri = { version = "2.12.4", features = ["wry"] }
tauri-plugin-updater = "2.13.0"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60.2", features = ["Win32_Foundation", "Win32_Security_Credentials"] }

name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install GTK/WebKit dev packages for the desktop crate
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt

      - name: Cache Rust build files
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Format
        run: cargo fmt --all -- --check

      - name: Server tests
        run: cargo test --locked -p ghostchat-server

      - name: Desktop tests
        run: cargo test --locked -p ghostchat-desktop

      - name: Install Playwright for the browser audio test
        run: |
          npm install -g playwright@1.63.0
          npx --yes playwright@1.63.0 install --with-deps chromium

      - name: Script tests
        run: |
          export NODE_PATH="$(npm root -g)"
          for f in scripts/test-*.cjs; do echo "== $f"; node "$f"; done

      - name: UI syntax check
        run: for f in crates/desktop/ui/*.js; do node --check "$f"; done

      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.23.0 --locked

      - name: Dependency audit
        run: cargo audit

name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install GTK/WebKit dev packages for the desktop crate
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt

      - name: Cache Rust build files
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Format
        run: cargo fmt --all -- --check

      - name: Server tests
        run: cargo test --locked -p ghostchat-server

      - name: Desktop tests
        run: cargo test --locked -p ghostchat-desktop

      - name: Install Playwright for the browser audio test
        run: |
          npm install -g playwright@1.63.0
          npx --yes playwright@1.63.0 install --with-deps chromium

      - name: Script tests
        run: |
          export NODE_PATH="$(npm root -g)"
          for f in scripts/test-*.cjs; do echo "== $f"; node "$f"; done

      - name: UI syntax check
        run: for f in crates/desktop/ui/*.js; do node --check "$f"; done

      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.23.0 --locked

      - name: Dependency audit
        run: cargo audit

  # release.yml has a `paths:` push filter, and GitHub skips it when the
  # matching file is not among the first 300 files of the push diff (the
  # 4.0.62 merge, 9532aaf, changed 3795 files and never released). After the
  # tests pass on main, dispatch the release if the version changed and no
  # release run exists for this commit yet.
  release-guard:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Dispatch the release if its push trigger did not start
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          version() {
            git show "$1:Cargo.toml" 2>/dev/null \
              | awk '/^\[/{section=$0} section=="[workspace.package]" && /^version *=/{gsub(/.*= *"|".*/, ""); print; exit}'
          }
          current="$(version HEAD)"
          previous="$(version HEAD^ || true)"
          if [ -z "$current" ] || [ "$current" = "$previous" ]; then
            echo "Version unchanged (${previous:-none} -> ${current:-none}); no release needed."
            exit 0
          fi
          runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/release.yml/runs?head_sha=$HEAD_SHA" --jq '.total_count')"
          if [ "$runs" != "0" ]; then
            echo "Release for $current already has $runs run(s) for $HEAD_SHA."
            exit 0
          fi
          main="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [ "$main" != "$HEAD_SHA" ]; then
            echo "main moved to $main; its own CI run decides its release."
            exit 0
          fi
          echo "Version $previous -> $current with no release run: dispatching release.yml."
          gh workflow run release.yml --ref main

name: Prepare GhostChat release draft

on:
  push:
    branches:
      - main
    paths:
      - "Cargo.toml"
      - "crates/desktop/tauri.conf.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build files
        uses: swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Check release tag and app versions
        shell: pwsh
        run: |
          $config = Get-Content -Raw "crates/desktop/tauri.conf.json" | ConvertFrom-Json
          $cargoToml = Get-Content -Raw "Cargo.toml"
          $match = [regex]::Match($cargoToml, '(?ms)^\[workspace\.package\]\s*version\s*=\s*"([^"]+)"')
          if (-not $match.Success -or $config.version -ne $match.Groups[1].Value) {
            throw "The workspace and Tauri app versions must match before publishing."
          }
          if ($env:GITHUB_REF_NAME -ne "main") {
            throw "Publish GhostChat releases from the main branch."
          }
          $releaseTag = "v$($config.version)"
          "RELEASE_TAG=$releaseTag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Set the GitHub Releases update feed
        shell: pwsh
        env:
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          $configPath = "crates/desktop/tauri.conf.json"
          $config = Get-Content -Raw $configPath | ConvertFrom-Json
          $config.plugins.updater.endpoints = @("https://github.com/$env:RELEASE_REPOSITORY/releases/latest/download/latest.json")
          $config | ConvertTo-Json -Depth 100 | Set-Content -Encoding utf8 $configPath

      - name: Build standalone Windows server
        shell: pwsh
        run: cargo build --release --locked --package ghostchat-server

      - name: Build, sign, and create draft
        uses: tauri-apps/tauri-action@action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          GHOSTCHAT_UPDATE_ENDPOINT: https://github.com/${{ github.repository }}/releases/latest/download/latest.json
        with:
          projectPath: crates/desktop
          tagName: v__VERSION__
          releaseName: GhostChat v__VERSION__
          releaseBody: |
            ## GhostChat 4.0

            This major update adds group conversations, replies, reactions, pins, unread status, invite links, profile photos, Windows notifications and tray controls, 5 GB file sharing, and voice/screen sharing through a separately configured LiveKit service.

            Direct and group text can be opted into MLS encryption after participants verify their security codes. New attachments in verified encrypted chats are encrypted on the device. Earlier messages and files remain unencrypted. MLS device replacement and portable encrypted-state recovery are not supported yet; account recovery restores account access only. Group voice and screen sharing are encrypted in transit but are not end-to-end encrypted.

            Review the security and deployment notes before using GhostChat for sensitive conversations or exposing a server to the internet.
          # The desktop updater reads GitHub's public "latest" release. A draft
          # has no downloadable latest.json, so clients would report up to date.
          releaseDraft: false
          prerelease: false
          args: --bundles msi
          updaterJsonPreferNsis: false
          uploadUpdaterJson: true

      - name: Attach standalone server and checksum
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $sourcePath = "target/release/ghostchat-server.exe"
          $releasePath = "target/release/ghostchat-server-windows-x64.exe"
          $checksumPath = "$releasePath.sha256"
          if (-not (Test-Path -LiteralPath $sourcePath)) { throw "The standalone server binary was not built." }
          Copy-Item -LiteralPath $sourcePath -Destination $releasePath -Force
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $releasePath).Hash.ToLowerInvariant()
          Set-Content -LiteralPath $checksumPath -Value "$hash  ghostchat-server-windows-x64.exe" -NoNewline
          $config = Get-Content -Raw "crates/desktop/tauri.conf.json" | ConvertFrom-Json
          $releaseTag = "v$($config.version)"
          gh release upload "$releaseTag" "$releasePath#ghostchat-server-windows-x64.exe" "$checksumPath#ghostchat-server-windows-x64.exe.sha256"
          if ($LASTEXITCODE -ne 0) { throw "Could not attach the standalone server assets to the GitHub Release." }

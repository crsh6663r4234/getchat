[workspace]
members = ["crates/server", "crates/desktop"]
# vendor/libsqlite3-sys is a [patch] source, not a member (no fmt/tests).
exclude = ["vendor"]
resolver = "2"

[workspace.package]
version = "4.0.56"
edition = "2021"
license = "MIT"

[workspace.dependencies]
argon2 = "0.5.3"
axum = { version = "0.7.9", features = ["ws"] }
base64 = "0.22.1"
rand = "0.8.8"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "native-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "net", "sync", "time", "signal", "fs", "io-util"] }
tower-http = { version = "0.5.2", features = ["cors", "limit"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.28.0", features = ["v4", "serde"] }

# RUSTSEC-2026-0459: libsqlite3-sys 0.30.1 (the only line sqlx 0.8 accepts)
# with its bundled SQLite replaced by 3.54.1. See
# vendor/libsqlite3-sys/GHOSTCHAT_PATCH.md before changing or removing this.
[patch.crates-io]
libsqlite3-sys = { path = "vendor/libsqlite3-sys" }

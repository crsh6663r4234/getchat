[workspace]
members = ["crates/server", "crates/desktop"]
resolver = "2"

[workspace.package]
version = "0.2.1"
edition = "2021"
license = "MIT"

[workspace.dependencies]
argon2 = "0.5.3"
axum = { version = "0.7.9", features = ["ws"] }
base64 = "0.22.1"
rand = "0.8.8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "net", "sync", "time", "signal"] }
tower-http = { version = "0.5.2", features = ["cors", "limit"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.28.0", features = ["v4", "serde"] }
